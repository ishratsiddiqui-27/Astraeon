# Astraeon theme, matched to the Figma design: deep-space navy, ember-orange accents, Moon-blue data.
# Locked to dark mode (no [theme.light] / [theme.dark] sections), because the charts and CSS are tuned for it.
# The starfield, glass cards and animations are in astraeon/style.py.

[theme]
base = "dark"
primaryColor = "#F97316"              # sliders, selected segments, active nav, chat send button
backgroundColor = "#0A0F1E"           # page
secondaryBackgroundColor = "#111A2E"  # inputs, popovers, dialogs
textColor = "#E6E9F2"
borderColor = "#1E2A44"
linkColor = "#FDBA74"
blueColor = "#60A5FA"                 # "Confirmed match" badge, Moon-zone data
orangeColor = "#F97316"               # "Near miss" badge
violetColor = "#A78BFA"
grayColor = "#8B95AD"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
headingFontSizes = ["2.25rem", "1.4rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "1.8rem"
baseRadius = "12px"
chartCategoricalColors = ["#60A5FA", "#F97316", "#8B95AD", "#A78BFA", "#34D399", "#FBBF24", "#F472B6"]
dataframeHeaderBackgroundColor = "#111A2E"
dataframeBorderColor = "#1E2A44"
